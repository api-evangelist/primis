name: PRIMIS
description: >-
  Primis (Primis CX) is a post-purchase customer experience platform for
  eCommerce retailers, headquartered in the UK and backed by 500 Global. Its
  products — Primis Track (branded order tracking), Primis Ship (discounted
  multi-carrier shipping), Primis Returns (label-less returns processing), and
  Primis International (cross-border logistics across 120+ carriers) — reduce
  "where is my order?" support volume and drive repeat purchases. Primis exposes
  a REST API (OpenAPI 3.0.0, 42 operations) over HTTPS with bearer-token
  authentication, covering retailers, orders, shipments, products, campaigns,
  billing, users, tracking pages, FAQs, and documents, and integrates with
  Shopify, BigCommerce, Adobe Commerce/Magento, WooCommerce, and carriers such
  as DPD, DHL, USPS, Evri, UPS, and FedEx.
